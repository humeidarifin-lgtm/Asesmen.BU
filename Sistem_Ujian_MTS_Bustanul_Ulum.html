<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISTEM UJIAN MTS BUSTANUL ULUM</title>
<style>
:root{--green:#16834a;--deep:#0d6035;--mint:#eaf7ef;--line:#dcebe1;--ink:#193326;--muted:#718477;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f8fffa,#eaf7ef 55%,#f7fff9);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--green);color:white;font-weight:650}button:hover{filter:brightness(.95)}button.secondary{background:#e8f4ec;color:var(--deep)}button.danger{background:#fff0f0;color:#b42318}button.ghost{background:transparent;color:var(--deep);border:1px solid var(--line)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#65b887;box-shadow:0 0 0 3px #16834a18}label{display:block;font-size:13px;font-weight:650;margin:10px 0 6px;color:#466052}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:#ffffffed;border:1px solid #dcebe1;border-radius:24px;padding:30px;box-shadow:0 20px 70px #174b2b16}.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#1e9c5b,#0c6136);display:grid;place-items:center;color:white;font-size:24px;font-weight:800}.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}.login-card h2{font-size:23px;margin:8px 0}.muted{color:var(--muted);font-size:13px}.password-wrap{display:flex;gap:7px}.password-wrap input{flex:1}.password-wrap button{background:#edf6f0;color:#236b43}
.app{display:none;min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;z-index:5}.sidebrand{display:flex;align-items:center;gap:10px;padding:5px 7px 22px}.sidebrand .logo{width:42px;height:42px;border-radius:13px}.sidebrand strong{font-size:12px;line-height:1.4}.navlabel{font-size:10px;letter-spacing:1.2px;color:#91a397;font-weight:800;padding:13px 10px 7px}.nav button{width:100%;display:flex;align-items:center;gap:11px;text-align:left;background:transparent;color:#52695b;margin:2px 0;padding:11px 12px;font-weight:600}.nav button.active,.nav button:hover{background:#eaf7ef;color:var(--deep)}.nav .ico{width:20px;text-align:center}.sidebottom{margin-top:auto;border-top:1px solid var(--line);padding-top:13px}.main{margin-left:250px;padding:25px 30px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px}.topbar h2{font-size:22px;margin:0}.userchip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);padding:8px 12px;border-radius:14px}.avatar{width:34px;height:34px;border-radius:50%;background:#dff2e6;color:var(--deep);display:grid;place-items:center;font-weight:800}.content{display:grid;gap:18px}.hero{background:linear-gradient(110deg,#fff,#e8f7ed);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:20px}.hero h3{font-size:21px;margin:0 0 7px}.hero p{margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 5px 20px #174b2b06}.stat .sicon{width:37px;height:37px;border-radius:11px;background:#eaf7ef;display:grid;place-items:center;margin-bottom:12px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.panel h3{margin:0 0 14px;font-size:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 14px}.formgrid .full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid #edf2ee;white-space:nowrap}th{font-size:11px;color:#708276;background:#f8fcf9}td small{color:var(--muted)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eaf7ef;color:#176b3d;font-size:11px;font-weight:700}.empty{padding:25px;text-align:center;color:var(--muted);font-size:13px}.hidden{display:none!important}.notice{padding:11px 13px;border-radius:10px;background:#eff8f2;color:#24643f;font-size:12px;margin-top:10px}.question{padding:15px;border:1px solid var(--line);border-radius:13px;margin:10px 0;background:#fcfffd}.option{display:flex;gap:9px;align-items:flex-start;padding:8px;border:1px solid #e7efe9;border-radius:9px;margin:7px 0;font-size:13px}.option input{width:auto;margin-top:2px}.photo{width:42px;height:42px;object-fit:cover;border-radius:50%;background:#eaf7ef}.mobilehead{display:none}
@media(max-width:900px){.sidebar{width:215px}.main{margin-left:215px;padding:20px}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.sidebar{position:relative;width:100%;height:auto;inset:auto;padding:10px}.sidebrand{padding:4px 5px 10px}.nav{display:flex;overflow:auto}.navlabel,.sidebottom{display:none}.nav button{white-space:nowrap;width:auto;font-size:12px;padding:9px}.main{margin:0;padding:15px}.topbar h2{font-size:18px}.grid2,.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.hero{align-items:flex-start;flex-direction:column}.stats{gap:9px}.stat{padding:12px}.login-card{padding:23px}}
</style>
</head>
<body>
<div id="login" class="login-wrap">
 <div class="login-card">
  <div class="brand"><div class="logo">BU</div><div><h1>SISTEM UJIAN MTS<br>BUSTANUL ULUM</h1><p>Computer Based Test • CBT</p></div></div>
  <h2>Selamat datang</h2><p class="muted">Silakan masuk menggunakan akun yang telah diberikan.</p>
  <form id="loginForm">
   <label>Username</label><input id="loginUser" autocomplete="username" placeholder="Masukkan username" required>
   <label>Password</label><div class="password-wrap"><input id="loginPass" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" id="togglePass" aria-label="Lihat password">◉</button></div>
   <button style="width:100%;margin-top:19px;padding:13px" type="submit">Masuk ke aplikasi →</button>
   <div id="loginError" class="notice hidden" style="background:#fff1f0;color:#a52a22">Username atau password salah.</div>
  </form>
  <p class="muted" style="margin-top:18px;text-align:center">MTS Bustanul Ulum • Sistem Ujian Digital</p>
 </div>
</div>
<div id="app" class="app">
 <aside class="sidebar">
  <div class="sidebrand"><div class="logo">BU</div><strong>SISTEM UJIAN<br>MTS BUSTANUL ULUM</strong></div>
  <div class="navlabel">MENU UTAMA</div><nav id="nav" class="nav"></nav>
  <div class="sidebottom"><button class="ghost" style="width:100%" onclick="logout()">⇥ Keluar</button></div>
 </aside>
 <main class="main">
  <div class="topbar"><h2 id="pageTitle">Dashboard</h2><div class="userchip"><div class="avatar" id="userAvatar">A</div><div><b id="userName" style="font-size:12px">Admin</b><div id="userRole" class="muted">Administrator</div></div></div></div>
  <div id="view" class="content"></div>
 </main>
</div>
<input id="filePicker" type="file" class="hidden">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY='mts_bustanul_cbt_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{school:{name:'MTS Bustanul Ulum',address:'',head:'',logo:''},users:[{username:'admin',password:'admin123',role:'admin',name:'Administrator'}],students:[],classes:[],questions:[],exams:[],results:[]};
let current=null,active='dashboard',examAnswers={};
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const $=id=>document.getElementById(id);
$('togglePass').onclick=()=>{$('loginPass').type=$('loginPass').type==='password'?'text':'password';$('togglePass').textContent=$('loginPass').type==='password'?'◉':'◎'};
$('loginForm').onsubmit=e=>{e.preventDefault();let u=db.users.find(x=>x.username===$('loginUser').value.trim()&&x.password===$('loginPass').value);if(!u){$('loginError').classList.remove('hidden');return}current=u;$('login').style.display='none';$('app').style.display='block';$('userName').textContent=u.name||u.username;$('userRole').textContent=u.role==='admin'?'Administrator':'Siswa';$('userAvatar').textContent=(u.name||u.username).charAt(0).toUpperCase();buildNav();go('dashboard')};
function logout(){current=null;$('app').style.display='none';$('login').style.display='grid';$('loginForm').reset()}
const adminMenu=[['dashboard','▦','Dashboard'],['school','▤','Biodata Lembaga'],['students','♙','Data Siswa'],['classes','▦','Pengaturan Kelas'],['accounts','♧','Akun & Kartu Login'],['questions','▣','Bank Soal'],['exams','✎','Ujian'],['scores','▤','Rekap & Leger Nilai']];
const clientMenu=[['dashboard','▦','Dashboard'],['profile','♙','Status Siswa'],['takeexam','✎','Halaman Ujian'],['myscores','▤','Nilai Saya']];
function buildNav(){let menu=current.role==='admin'?adminMenu:clientMenu;$('nav').innerHTML=menu.map(([id,ic,t])=>`<button data-page="${id}" onclick="go('${id}')"><span class="ico">${ic}</span>${t}</button>`).join('')+'<button onclick="logout()"><span class="ico">⇥</span>Keluar</button>'}
function go(id){active=id;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));let titles={dashboard:'Dashboard',school:'Biodata Lembaga',students:'Data Siswa',classes:'Pengaturan Kelas',accounts:'Akun & Kartu Login',questions:'Bank Soal',exams:'Pengaturan Ujian',scores:'Rekap & Leger Nilai',profile:'Status Siswa',takeexam:'Halaman Ujian',myscores:'Nilai Saya'};$('pageTitle').textContent=titles[id]||id;render()}
function stat(label,num,icon){return `<div class="stat"><div class="sicon">${icon}</div><b>${num}</b><span>${label}</span></div>`}
function render(){let v=$('view');if(active==='dashboard')return dashboard(v);if(active==='school')return school(v);if(active==='students')return students(v);if(active==='classes')return classes(v);if(active==='accounts')return accounts(v);if(active==='questions')return questions(v);if(active==='exams')return exams(v);if(active==='scores')return scores(v);if(active==='profile')return profile(v);if(active==='takeexam')return takeexam(v);if(active==='myscores')return myscores(v)}
function dashboard(v){if(current.role==='admin'){v.innerHTML=`<div class="hero"><div><h3>Assalamu'alaikum, ${esc(current.name||'Administrator')} 👋</h3><p>Selamat datang di pusat pengelolaan ujian MTS Bustanul Ulum.</p></div><span class="pill">ADMINISTRATOR</span></div><div class="stats">${stat('Total siswa',db.students.length,'♙')}${stat('Jumlah kelas',db.classes.length,'▦')}${stat('Bank soal',db.questions.length,'▣')}${stat('Hasil ujian',db.results.length,'✓')}</div><div class="grid2"><div class="panel"><h3>Ringkasan sistem</h3><p class="muted">Kelola data siswa, kelas, akun, soal, jadwal ujian dan nilai melalui menu di samping.</p></div><div class="panel"><h3>Informasi awal</h3><p class="muted">Akun awal admin: <b>admin</b> / <b>admin123</b>. Segera ubah password setelah login dan buat akun siswa pada menu Akun & Kartu Login.</p></div></div>`}else{let s=studentOf(current);v.innerHTML=`<div class="hero"><div><h3>Selamat datang, ${esc(current.name||current.username)} 👋</h3><p>Semoga sukses mengikuti ujian. Kerjakan soal dengan teliti.</p></div><span class="pill">PESERTA UJIAN</span></div><div class="stats">${stat('Nama siswa',s?esc(s.name):esc(current.name),'♙')}${stat('Kelas',s?esc(s.className):'-','▦')}${stat('Ujian tersedia',db.exams.filter(e=>e.active).length,'✎')}${stat('Ujian selesai',db.results.filter(r=>r.username===current.username).length,'✓')}</div><div class="panel"><h3>Petunjuk ujian</h3><p class="muted">Pilih menu Halaman Ujian untuk melihat ujian yang tersedia. Pastikan mengirim jawaban sebelum meninggalkan halaman.</p></div>`}}
function school(v){v.innerHTML=`<div class="panel"><h3>Identitas lembaga</h3><div class="formgrid"><div><label>Nama lembaga</label><input id="schName" value="${attr(db.school.name)}"></div><div><label>Kepala madrasah</label><input id="schHead" value="${attr(db.school.head)}"></div><div class="full"><label>Alamat lembaga</label><textarea id="schAddress">${esc(db.school.address)}</textarea></div><div class="full"><label>Logo / foto profil lembaga</label><input id="schLogo" type="file" accept="image/*"><small class="muted">Format gambar JPG/PNG.</small>${db.school.logo?`<p><img src="${db.school.logo}" style="max-width:90px;max-height:90px;object-fit:contain"></p>`:''}</div></div><div class="actions"><button onclick="saveSchool()">Simpan biodata</button></div></div>`}
async function saveSchool(){db.school.name=$('schName').value;db.school.head=$('schHead').value;db.school.address=$('schAddress').value;let f=$('schLogo').files[0];if(f)db.school.logo=await dataURL(f);save();alert('Biodata lembaga disimpan.')}
function students(v){v.innerHTML=`<div class="panel"><h3>Input biodata siswa</h3><div class="formgrid"><div><label>NIS / NISN</label><input id="stNis" placeholder="Nomor induk"></div><div><label>Nama lengkap</label><input id="stName" placeholder="Nama siswa"></div><div><label>Tempat lahir</label><input id="stBirthPlace"></div><div><label>Tanggal lahir</label><input id="stBirthDate" type="date"></div><div><label>Jenis kelamin</label><select id="stGender"><option value="">Pilih</option><option>Laki-laki</option><option>Perempuan</option></select></div><div><label>Kelas</label><select id="stClass">${classOptions()}</select></div><div><label>Nama ayah</label><input id="stFather"></div><div><label>Nama ibu</label><input id="stMother"></div><div><label>Alamat</label><input id="stAddress"></div><div><label>No. HP wali</label><input id="stPhone"></div></div><div class="actions"><button onclick="addStudent()">Simpan siswa</button><button class="secondary" onclick="pickImport('students')">⇧ Impor Word / PDF / Excel</button><button class="ghost" onclick="downloadTemplate()">Unduh template CSV</button></div><div class="notice">Impor: Excel (.xlsx/.xls), Word (.docx), PDF. Untuk hasil terbaik, gunakan tabel dengan kolom NIS, Nama, Kelas, Jenis Kelamin, Tempat Lahir, Tanggal Lahir, Ayah, Ibu, Alamat, HP Wali.</div></div><div class="panel"><h3>Daftar siswa (${db.students.length})</h3><div class="tablewrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Jenis kelamin</th><th>Aksi</th></tr></thead><tbody>${db.students.map((s,i)=>`<tr><td>${esc(s.nis)}</td><td>${esc(s.name)}</td><td>${esc(s.className)}</td><td>${esc(s.gender)}</td><td><button class="danger" onclick="delStudent(${i})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada data siswa.</td></tr>'}</tbody></table></div></div>`}
function addStudent(){let s={nis:$('stNis').value.trim(),name:$('stName').value.trim(),birthPlace:$('stBirthPlace').value,birthDate:$('stBirthDate').value,gender:$('stGender').value,className:$('stClass').value,father:$('stFather').value,mother:$('stMother').value,address:$('stAddress').value,phone:$('stPhone').value};if(!s.nis||!s.name)return alert('NIS dan nama wajib diisi.');if(db.students.some(x=>x.nis===s.nis))return alert('NIS sudah terdaftar.');db.students.push(s);save();render()}
function delStudent(i){if(confirm('Hapus data siswa ini?')){let s=db.students.splice(i,1)[0];db.users=db.users.filter(u=>u.username!==s.nis);save();render()}}
function classOptions(){return '<option value="">Pilih kelas</option>'+db.classes.map(c=>`<option>${esc(c.name)}</option>`).join('')}
function classes(v){v.innerHTML=`<div class="panel"><h3>Tambah kelas dan wali kelas</h3><div class="formgrid"><div><label>Nama kelas</label><input id="className" placeholder="Contoh: VII A"></div><div><label>Wali kelas</label><input id="classTeacher" placeholder="Nama wali kelas"></div></div><div class="actions"><button onclick="addClass()">Simpan kelas</button></div></div><div class="panel"><h3>Daftar kelas</h3><div class="tablewrap"><table><thead><tr><th>Kelas</th><th>Wali kelas</th><th>Jumlah siswa</th><th>Aksi</th></tr></thead><tbody>${db.classes.map((c,i)=>`<tr><td>${esc(c.name)}</td><td>${esc(c.teacher)}</td><td>${db.students.filter(s=>s.className===c.name).length}</td><td><button class="danger" onclick="delClass(${i})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada kelas.</td></tr>'}</tbody></table></div></div>`}
function addClass(){let name=$('className').value.trim();if(!name)return alert('Isi nama kelas.');if(db.classes.some(c=>c.name===name))return alert('Kelas sudah ada.');db.classes.push({name,teacher:$('classTeacher').value});save();render()}
function delClass(i){if(confirm('Hapus kelas?')){db.classes.splice(i,1);save();render()}}
function accounts(v){v.innerHTML=`<div class="panel"><h3>Buat akun login siswa</h3><div class="formgrid"><div><label>Pilih siswa</label><select id="accStudent">${db.students.map(s=>`<option value="${attr(s.nis)}">${esc(s.name)} — ${esc(s.nis)}</option>`).join('')}</select></div><div><label>Username</label><input id="accUser" placeholder="Isi username"></div><div><label>Password</label><input id="accPass" placeholder="Buat password"></div><div><label>Foto untuk kartu login</label><input id="accPhoto" type="file" accept="image/*"></div></div><div class="actions"><button onclick="createAccount()">Buat akun</button><button class="secondary" onclick="printCards()">Cetak kartu login</button></div><div class="notice">Akun siswa dibuat berdasarkan data siswa. Bagikan username dan password kepada siswa secara pribadi.</div></div><div class="panel"><h3>Akun terdaftar</h3><div class="tablewrap"><table><thead><tr><th>Username</th><th>Nama</th><th>Peran</th><th>Aksi</th></tr></thead><tbody>${db.users.map((u,i)=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${u.role}</td><td>${u.role==='student'?`<button class="danger" onclick="delAccount(${i})">Hapus</button>`:'-'}</td></tr>`).join('')}</tbody></table></div></div>`}
async function createAccount(){let nis=$('accStudent').value,s=db.students.find(x=>x.nis===nis),username=$('accUser').value.trim()||nis,password=$('accPass').value;if(!s)return alert('Tambahkan data siswa terlebih dahulu.');if(!password)return alert('Isi password.');if(db.users.some(u=>u.username===username))return alert('Username sudah digunakan.');let photo=$('accPhoto').files[0];db.users.push({username,password,role:'student',name:s.name,nis,photo:photo?await dataURL(photo):''});save();alert('Akun siswa berhasil dibuat.');render()}
function delAccount(i){if(confirm('Hapus akun ini?')){db.users.splice(i,1);save();render()}}
function printCards(){let us=db.users.filter(u=>u.role==='student');if(!us.length)return alert('Belum ada akun siswa.');let w=window.open('','_blank');w.document.write('<html><head><title>Kartu Login Siswa</title><style>body{font-family:Arial;display:flex;flex-wrap:wrap;gap:14px}.card{width:310px;border:1px solid #18834a;border-radius:12px;padding:16px;page-break-inside:avoid}.head{color:#13723d;font-weight:bold}.muted{color:#667;font-size:12px}</style></head><body>'+us.map(u=>`<div class="card">${u.photo?`<img src="${u.photo}" style="width:55px;height:55px;object-fit:cover;border-radius:50%;float:right">`:''}<div class="head">MTS BUSTANUL ULUM</div><h3>KARTU LOGIN CBT</h3><b>${esc(u.name)}</b><p class="muted">Username: ${esc(u.username)}<br>Password: ${esc(u.password)}<br>Kelas: ${esc((db.students.find(s=>s.nis===u.nis)||{}).className||'-')}</p></div>`).join('')+'</body></html>');w.document.close();w.print()}
function questions(v){v.innerHTML=`<div class="panel"><h3>Tambah soal secara manual</h3><label>Mata pelajaran / judul bank soal</label><input id="qSubject" placeholder="Contoh: Matematika"><label>Pertanyaan</label><textarea id="qText" rows="3" placeholder="Tulis pertanyaan..."></textarea><div class="formgrid">${['A','B','C','D','E'].map(k=>`<div><label>Opsi ${k}</label><input id="opt${k}" placeholder="Jawaban ${k}"></div>`).join('')}<div><label>Kunci jawaban</label><select id="qKey"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select></div></div><div class="actions"><button onclick="addQuestion()">Simpan soal</button><button class="secondary" onclick="pickImport('questions')">⇧ Impor soal Word / Excel / PDF / JPG</button></div><div class="notice">Format teks impor yang disarankan: 1. Pertanyaan; A. opsi; B. opsi; C. opsi; D. opsi; Kunci Jawaban: A. Untuk JPG/PDF hasil scan, sistem mencoba OCR; periksa kembali hasilnya.</div></div><div class="panel"><h3>Bank soal (${db.questions.length})</h3><div class="tablewrap"><table><thead><tr><th>No.</th><th>Mapel</th><th>Pertanyaan</th><th>Kunci</th><th>Aksi</th></tr></thead><tbody>${db.questions.map((q,i)=>`<tr><td>${i+1}</td><td>${esc(q.subject)}</td><td>${esc(q.text).slice(0,90)}</td><td><span class="pill">${esc(q.key)}</span></td><td><button class="danger" onclick="delQuestion(${i})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada soal.</td></tr>'}</tbody></table></div></div>`}
function addQuestion(){let q={subject:$('qSubject').value.trim(),text:$('qText').value.trim(),options:['A','B','C','D','E'].map(k=>$('opt'+k).value.trim()).filter(Boolean),key:$('qKey').value};if(!q.text||q.options.length<2)return alert('Isi pertanyaan dan minimal dua opsi.');db.questions.push(q);save();render()}
function delQuestion(i){if(confirm('Hapus soal?')){db.questions.splice(i,1);save();render()}}
function exams(v){v.innerHTML=`<div class="panel"><h3>Buat / aktifkan ujian</h3><div class="formgrid"><div><label>Nama ujian</label><input id="examName" placeholder="Contoh: PTS Semester Ganjil"></div><div><label>Mata pelajaran</label><input id="examSubject" placeholder="Mapel"></div><div><label>Kelas</label><select id="examClass">${classOptions()}</select></div><div><label>Durasi (menit)</label><input id="examDuration" type="number" value="60" min="1"></div></div><div class="actions"><button onclick="addExam()">Buat ujian</button></div></div><div class="panel"><h3>Daftar ujian</h3>${db.exams.map((e,i)=>`<div class="question"><b>${esc(e.name)}</b> <span class="pill">${e.active?'Aktif':'Nonaktif'}</span><p class="muted">${esc(e.subject)} • ${esc(e.className)} • ${e.duration} menit • ${e.questionIds.length} soal</p><div class="actions"><button class="secondary" onclick="toggleExam(${i})">${e.active?'Nonaktifkan':'Aktifkan'}</button><button class="danger" onclick="delExam(${i})">Hapus</button></div></div>`).join('')||'<div class="empty">Belum ada ujian.</div>'}</div>`}
function addExam(){let name=$('examName').value.trim(),subject=$('examSubject').value.trim(),className=$('examClass').value;if(!name||!db.questions.length)return alert('Isi nama ujian dan siapkan bank soal.');let qs=db.questions.map((q,i)=>i);db.exams.push({name,subject,className,duration:+$('examDuration').value||60,questionIds:qs,active:true});save();render()}
function toggleExam(i){db.exams[i].active=!db.exams[i].active;save();render()}function delExam(i){if(confirm('Hapus ujian?')){db.exams.splice(i,1);save();render()}}
function scores(v){let rows=db.results;v.innerHTML=`<div class="panel"><h3>Rekap nilai seluruh siswa</h3><div class="actions"><select id="filterClass" onchange="renderScoreTable()" style="max-width:220px">${'<option value="">Semua kelas</option>'+db.classes.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><button class="secondary" onclick="exportScores()">Unduh rekap CSV</button></div><div id="scoreTable"></div></div>`;renderScoreTable()}
function renderScoreTable(){let f=$('filterClass')?.value||'',rows=db.results.filter(r=>!f||r.className===f);$('scoreTable').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Ujian</th><th>Benar</th><th>Total</th><th>Nilai</th><th>Tanggal</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.className)}</td><td>${esc(r.exam)}</td><td>${r.correct}</td><td>${r.total}</td><td><b>${r.score}</b></td><td>${esc(r.date)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Belum ada hasil ujian.</td></tr>'}</tbody></table></div>`}
function exportScores(){let rows=[['Nama','Kelas','Ujian','Benar','Total','Nilai','Tanggal'],...db.results.map(r=>[r.name,r.className,r.exam,r.correct,r.total,r.score,r.date])];downloadText('rekap-nilai.csv',rows.map(r=>r.map(csv).join(',')).join('\n'))}
function profile(v){let s=studentOf(current);v.innerHTML=`<div class="panel"><h3>Status siswa</h3>${s?`<div class="formgrid"><div><label>Nama</label><input value="${attr(s.name)}" disabled></div><div><label>NIS</label><input value="${attr(s.nis)}" disabled></div><div><label>Kelas</label><input value="${attr(s.className)}" disabled></div><div><label>Jenis kelamin</label><input value="${attr(s.gender)}" disabled></div><div><label>Tempat, tanggal lahir</label><input value="${attr((s.birthPlace||'')+', '+(s.birthDate||''))}" disabled></div><div><label>Wali</label><input value="${attr(s.father||'')}" disabled></div></div>`:'<p class="muted">Data siswa belum ditautkan ke akun ini. Hubungi admin madrasah.</p>'}</div>`}
function takeexam(v){let s=studentOf(current),cls=s?.className;let list=db.exams.filter(e=>e.active&&(!e.className||e.className===cls));v.innerHTML=`<div class="panel"><h3>Ujian tersedia</h3>${list.map((e,i)=>`<div class="question"><b>${esc(e.name)}</b><p class="muted">${esc(e.subject)} • ${e.duration} menit</p><button onclick="startExam('${e.id||db.exams.indexOf(e)}')">Mulai ujian →</button></div>`).join('')||'<div class="empty">Belum ada ujian aktif untuk kelas Anda.</div>'}</div>`}
function startExam(id){let e=db.exams[+id];if(!e)return;let qs=e.questionIds.map(i=>db.questions[i]).filter(Boolean);if(!qs.length)return alert('Soal ujian tidak tersedia.');examAnswers={};let v=$('view');v.innerHTML=`<div class="hero"><div><h3>${esc(e.name)}</h3><p>${esc(e.subject)} • ${qs.length} soal • Durasi ${e.duration} menit</p></div><span class="pill">SEDANG BERLANGSUNG</span></div><div class="panel"><form id="examForm">${qs.map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.text)}</b>${q.options.map((o,j)=>`<label class="option"><input type="radio" name="q${i}" value="${'ABCDE'[j]}"> <span><b>${'ABCDE'[j]}.</b> ${esc(o)}</span></label>`).join('')}</div>`).join('')}<button type="submit">Kirim jawaban ujian</button></form></div>`;$('examForm').onsubmit=ev=>{ev.preventDefault();if(!confirm('Kirim jawaban sekarang?'))return;let correct=0;qs.forEach((q,i)=>{let a=new FormData($('examForm')).get('q'+i);if(a===q.key)correct++});let s=studentOf(current);db.results.push({username:current.username,name:current.name,className:s?.className||'-',exam:e.name,correct,total:qs.length,score:Math.round(correct/qs.length*100),date:new Date().toLocaleString('id-ID')});save();alert('Jawaban terkirim. Nilai: '+Math.round(correct/qs.length*100));go('myscores')}}
function myscores(v){let rows=db.results.filter(r=>r.username===current.username);v.innerHTML=`<div class="panel"><h3>Riwayat nilai saya</h3><div class="tablewrap"><table><thead><tr><th>Ujian</th><th>Benar</th><th>Total</th><th>Nilai</th><th>Tanggal</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.exam)}</td><td>${r.correct}</td><td>${r.total}</td><td><b>${r.score}</b></td><td>${esc(r.date)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada nilai.</td></tr>'}</tbody></table></div></div>`}
function studentOf(u){return db.students.find(s=>s.nis===u.nis)||db.students.find(s=>s.nis===u.username)}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function attr(x){return esc(x).replace(/`/g,'&#96;')}
function dataURL(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function pickImport(type){let p=$('filePicker');p.accept=type==='students'?'.xlsx,.xls,.docx,.pdf':'.xlsx,.xls,.docx,.pdf,.jpg,.jpeg,.png';p.dataset.type=type;p.onchange=()=>importFile(p.files[0],type);p.click()}
async function importFile(file,type){if(!file)return;try{let text='';let ext=file.name.split('.').pop().toLowerCase();if(['xlsx','xls'].includes(ext)){let wb=XLSX.read(await file.arrayBuffer(),{type:'array'});text=wb.SheetNames.map(n=>XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n')}else if(ext==='docx'){let r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});text=r.value}else if(ext==='pdf'){let pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){let page=await pdf.getPage(i),c=await page.getTextContent();text+=c.items.map(x=>x.str).join(' ')+'\n'}}else if(['jpg','jpeg','png'].includes(ext)){if(!window.Tesseract)throw Error('OCR tidak tersedia.');let r=await Tesseract.recognize(file,'ind+eng');text=r.data.text}else throw Error('Format file belum didukung.');if(type==='students')importStudentsText(text,ext);else importQuestionsText(text);save();render();alert('Impor selesai. Mohon periksa kembali data hasil impor, terutama kunci jawaban.')}catch(e){alert('Gagal membaca file: '+e.message)}}
function importStudentsText(text,ext){let lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;lines.forEach((line,i)=>{let a=line.includes('\t')?line.split('\t'):line.split(/[,;|]/);if(i===0&&/nis|nama/i.test(line))return;if(a.length<2)return;let nis=a[0].trim(),name=a[1].trim();if(!nis||!name||db.students.some(s=>s.nis===nis))return;db.students.push({nis,name,className:a[2]?.trim()||'',gender:a[3]?.trim()||'',birthPlace:a[4]?.trim()||'',birthDate:a[5]?.trim()||'',father:a[6]?.trim()||'',mother:a[7]?.trim()||'',address:a[8]?.trim()||'',phone:a[9]?.trim()||''});added++});alert('Data siswa ditambahkan: '+added)}
function importQuestionsText(text){let blocks=text.split(/(?=^\s*\d+[\.\)]\s+)/m).filter(x=>x.trim());let added=0;blocks.forEach(b=>{let lines=b.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return;let qtext=lines[0].replace(/^\d+[\.\)]\s*/,''),opts=[],key='';lines.slice(1).forEach(l=>{let m=l.match(/^([A-E])[\.\)\:]\s*(.+)/i);if(m)opts.push({k:m[1].toUpperCase(),v:m[2]});let km=l.match(/(?:kunci(?:\s+jawaban)?|jawaban\s+benar)\s*[:\-]\s*([A-E])/i);if(km)key=km[1].toUpperCase()});if(qtext&&opts.length>=2&&key){db.questions.push({subject:'Impor',text:qtext,options:opts.sort((a,b)=>a.k.localeCompare(b.k)).map(x=>x.v),key});added++}});alert('Soal yang terbaca beserta kunci: '+added+'. Jika 0, susun ulang dokumen mengikuti format contoh.')}
function downloadTemplate(){downloadText('template-data-siswa.csv','NIS,Nama,Kelas,Jenis Kelamin,Tempat Lahir,Tanggal Lahir,Nama Ayah,Nama Ibu,Alamat,HP Wali\n')}
function csv(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}function downloadText(name,text){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
</script>
</body></html>
